name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven reactor
        run: ./mvnw -B verify

      - name: Check diff whitespace
        run: git diff --check

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build service images
        run: docker compose build product-service order-service

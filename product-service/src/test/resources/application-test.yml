spring:
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # The migrations run against H2 on every `./mvnw test`. This is what stops
      # V*.sql from rotting: a typo fails the build instead of the deploy.
      ddl-auto: validate
    show-sql: false

server:
  port: 8081

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/productdb
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities still match
      # it, and refuses to start if they drifted. It must never write DDL again.
      ddl-auto: validate
    show-sql: true
  flyway:
    locations: classpath:db/migration/product

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] [%thread] %logger{36} %msg %kvp%n"

inventory:
  reservation:
    ttl: PT15M
    expiry-interval: PT5S
    expiry-batch-size: 100

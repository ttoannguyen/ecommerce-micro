server:
  port: 8081

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/productdb
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities still match
      # it, and refuses to start if they drifted. It must never write DDL again.
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

inventory:
  reservation:
    ttl: PT15M
    expiry-interval: PT5S
    expiry-batch-size: 100
